services:
  postgres:
    image: postgres:16-alpine
    container_name: secmynet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secmynet
      POSTGRES_USER: secmynet
      POSTGRES_PASSWORD: secmynet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secmynet -d secmynet"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: secmynet-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: secmynet
      DOCKER_INFLUXDB_INIT_PASSWORD: secmynet-influx-password
      DOCKER_INFLUXDB_INIT_ORG: secmynet
      DOCKER_INFLUXDB_INIT_BUCKET: router-telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: secmynet-local-influx-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
