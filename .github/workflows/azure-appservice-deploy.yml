name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AZURE_POSTGRES_HOST: ${{ secrets.AZURE_POSTGRES_HOST }}
      AZURE_POSTGRES_PORT: ${{ secrets.AZURE_POSTGRES_PORT }}
      AZURE_POSTGRES_DB: ${{ secrets.AZURE_POSTGRES_DB }}
      AZURE_POSTGRES_USER: ${{ secrets.AZURE_POSTGRES_USER }}
      AZURE_POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
      AZURE_POSTGRES_SSLMODE: ${{ secrets.AZURE_POSTGRES_SSLMODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: production
          package: .
